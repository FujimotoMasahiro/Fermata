name: Build macOS Universal Binary

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Fermata (Universal arm64 + x86_64)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode and macOS version
        run: |
          sw_vers
          xcodebuild -version

      - name: Import Developer ID certificate (optional)
        id: signing
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$CERT_BASE64" && -n "$CERT_PASSWORD" && -n "$TEAM_ID" ]]; then
            echo "Developer ID secrets detected. Configuring signed build..."
            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASS="$(uuidgen)"
            CERT_PATH="$RUNNER_TEMP/certificate.p12"

            echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            rm -f "$CERT_PATH"

            SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -n 1 | awk -F'"' '{print $2}')
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "identity=$SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"
            echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          else
            echo "No Developer ID secrets set. Using free ad-hoc signing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "team_id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Universal Binary (Release)
        run: |
          xcodebuild \
            -project Fermata.xcodeproj \
            -scheme Fermata \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ steps.signing.outputs.identity }}" \
            DEVELOPMENT_TEAM="${{ steps.signing.outputs.team_id }}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            build

      - name: Re-sign with Hardened Runtime & timestamp (Developer ID only)
        if: steps.signing.outputs.signed == 'true'
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/Fermata.app"
          IDENTITY="${{ steps.signing.outputs.identity }}"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" \
            "$APP_PATH/Contents/Library/LaunchServices/com.fujimotomasahiro.Fermata.Helper"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" \
            "$APP_PATH/Contents/Library/LoginItems/Launch Fermata.app"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Verify Universal Binary architectures
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/Fermata.app"
          APP_BIN="$APP_PATH/Contents/MacOS/Fermata"
          HELPER_BIN="$APP_PATH/Contents/Library/LaunchServices/com.fujimotomasahiro.Fermata.Helper"
          LAUNCHER_BIN="$APP_PATH/Contents/Library/LoginItems/Launch Fermata.app/Contents/MacOS/Launch Fermata"

          for bin in "$APP_BIN" "$HELPER_BIN" "$LAUNCHER_BIN"; do
            echo "Checking: $bin"
            ARCH_OUT=$(lipo -info "$bin")
            echo "  $ARCH_OUT"
            echo "$ARCH_OUT" | grep -q "arm64"
            echo "$ARCH_OUT" | grep -q "x86_64"
          done

      - name: Package release zip
        run: |
          mkdir -p dist/Fermata-universal/Scripts
          cp -R "build/DerivedData/Build/Products/Release/Fermata.app" dist/Fermata-universal/
          cp Scripts/install-helper.sh Scripts/uninstall-helper.sh dist/Fermata-universal/Scripts/
          chmod +x dist/Fermata-universal/Scripts/*.sh
          cp LICENSE README.md dist/Fermata-universal/

          (cd dist && ditto -c -k --sequesterRsrc --keepParent Fermata-universal Fermata-universal.zip)
          shasum -a 256 dist/Fermata-universal.zip > dist/Fermata-universal.zip.sha256
          cat dist/Fermata-universal.zip.sha256

      - name: Notarize zip (optional, requires Apple ID secrets)
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$APPLE_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            xcrun notarytool submit dist/Fermata-universal.zip \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$TEAM_ID" \
              --wait
            xcrun stapler staple dist/Fermata-universal/Fermata.app
            rm -f dist/Fermata-universal.zip
            (cd dist && ditto -c -k --sequesterRsrc --keepParent Fermata-universal Fermata-universal.zip)
            shasum -a 256 dist/Fermata-universal.zip > dist/Fermata-universal.zip.sha256
          else
            echo "Notarization secrets not set. Skipping notarization."
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fermata-universal
          path: |
            dist/Fermata-universal.zip
            dist/Fermata-universal.zip.sha256

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Fermata-universal.zip
            dist/Fermata-universal.zip.sha256
